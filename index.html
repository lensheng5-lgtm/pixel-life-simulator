<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生模拟器 · 像素版</title>
<style>
  :root{
    --bg:#0b0912;
    --panel:#141020;
    --panel2:#1b1530;
    --line:#3d3260;
    --text:#eee5d3;
    --dim:#9c90b8;
    --gold:#ffc857;
    --red:#ff6b6b;
    --green:#7ee787;
    --blue:#6ecbff;
    --pink:#ff9ecb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background-color:var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
      radial-gradient(900px 500px at 50% 0%, #1c1233 0%, transparent 65%),
      radial-gradient(700px 500px at 90% 100%, #16101f 0%, transparent 60%);
    background-size:8px 8px,8px 8px,auto,auto;
    color:var(--text);
    font-family:"Courier New","SimSun","宋体",monospace;
    overflow:hidden;
  }
  #scanlines{position:fixed;inset:0;z-index:100;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 2px, transparent 2px, transparent 4px);
    opacity:.4;
  }
  #scanlines::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6) 100%);}
  #app{height:100dvh;width:100%;max-width:1080px;min-width:0;margin:0 auto;padding:16px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
  .screen{width:100%;height:100%;min-width:0;display:flex;align-items:center;justify-content:center}
  .hidden{display:none !important}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges}

  /* ===== 开始页 ===== */
  .start-box{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:24px;animation:appear .5s steps(5)}
  .logo-cn{
    font-size:clamp(38px,7vw,76px);font-weight:900;letter-spacing:.1em;color:var(--gold);
    text-shadow:3px 3px 0 #000, 6px 6px 0 #8a3b2a, 0 0 26px rgba(255,200,87,.25);
    line-height:1.05;
  }
  .logo-cn .cursor{display:inline-block;width:.55em;height:1em;background:var(--red);vertical-align:-.08em;margin-left:.08em;animation:blink 1s steps(1) infinite}
  .logo-en{font-size:clamp(10px,2vw,14px);letter-spacing:.55em;color:var(--dim);margin-top:10px}
  .tagline{color:var(--text);font-size:clamp(14px,2.2vw,18px);letter-spacing:.16em}
  .tagline b{color:var(--pink)}
  .start-avatar{width:144px;height:144px;border:3px solid var(--line);box-shadow:0 0 0 3px #000, 8px 8px 0 rgba(0,0,0,.5);background:#100d1a;animation:bob 1.2s steps(2) infinite}
  .start-info{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:12px;letter-spacing:.08em}
  .start-info span{border:2px solid var(--line);padding:5px 10px;background:rgba(0,0,0,.25)}
  .hint{color:var(--dim);font-size:12px;letter-spacing:.08em}

  /* ===== 按钮 ===== */
  .pixel-btn{
    font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.14em;cursor:pointer;
    color:#1a1020;background:var(--gold);border:3px solid #000;padding:14px 28px;
    box-shadow:inset -4px -4px 0 rgba(0,0,0,.28), 0 6px 0 #000;
    transition:none;user-select:none;
  }
  .pixel-btn:hover:not(:disabled){filter:brightness(1.08)}
  .pixel-btn:active:not(:disabled){transform:translateY(4px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.28), 0 2px 0 #000}
  .pixel-btn:disabled{opacity:.38;cursor:not-allowed}
  .pixel-btn.small{font-size:12px;padding:10px 14px;letter-spacing:.08em}
  .pixel-btn.ghost{background:var(--panel2);color:var(--text);border-color:var(--line);box-shadow:0 4px 0 #000}
  .pixel-select{
    font-family:inherit;font-size:12px;color:var(--text);background:var(--panel2);
    border:3px solid var(--line);padding:8px 6px;outline:none;cursor:pointer;
    box-shadow:0 4px 0 #000;
  }

  /* ===== 面板 ===== */
  .panel{
    width:100%;max-width:920px;max-height:100%;overflow-y:auto;background:var(--panel);
    border:3px solid var(--line);box-shadow:0 0 0 3px #000, 10px 10px 0 rgba(0,0,0,.55);
    padding:22px;position:relative;
  }
  .panel::before,.panel::after{content:"";position:absolute;width:8px;height:8px;background:var(--gold)}
  .panel::before{top:-3px;left:-3px}
  .panel::after{bottom:-3px;right:-3px}
  .panel{overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line) #0b0912}
  .panel::-webkit-scrollbar,.side-panel::-webkit-scrollbar,#screen-end::-webkit-scrollbar{width:10px;height:10px;background:#0b0912}
  .panel::-webkit-scrollbar-thumb,.side-panel::-webkit-scrollbar-thumb,#screen-end::-webkit-scrollbar-thumb{background:var(--line);border:2px solid #0b0912}
  .panel::-webkit-scrollbar-corner,.side-panel::-webkit-scrollbar-corner,#screen-end::-webkit-scrollbar-corner{background:#0b0912}
  .screen-title{font-size:clamp(18px,3vw,26px);letter-spacing:.3em;color:var(--gold);text-align:center;margin-bottom:18px;text-shadow:2px 2px 0 #000}
  .section-title{font-size:14px;letter-spacing:.24em;color:var(--blue);margin:18px 0 10px;text-shadow:2px 2px 0 #000}
  .setup-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
  .attr-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .attr-cell{background:var(--panel2);border:2px solid var(--line);padding:9px 8px}
  .attr-head{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:.1em;margin-bottom:7px}
  .attr-head b{color:var(--text);font-size:13px}
  .pixel-bar{height:9px;background:#090711;border:2px solid #000;position:relative;overflow:hidden}
  .pixel-bar i{display:block;height:100%;background:var(--gold);transition:width .2s steps(5)}
  .talent-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .talent-card{
    text-align:left;font-family:inherit;color:var(--text);background:var(--panel2);
    border:2px solid var(--line);padding:11px 12px;cursor:pointer;position:relative;
    min-height:62px;
  }
  .talent-card:hover{border-color:var(--dim);background:#221a3a}
  .talent-card.selected{border-color:var(--gold);background:#2a2030;box-shadow:inset 0 0 0 2px rgba(255,200,87,.25)}
  .talent-card.selected::after{content:"✓";position:absolute;top:6px;right:9px;color:var(--gold);font-weight:900}
  .talent-name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:.06em;margin-bottom:5px}
  .talent-card.selected .talent-name{color:var(--gold)}
  .talent-desc{font-size:11px;color:var(--dim);line-height:1.5;letter-spacing:.02em}
  .begin-wrap{display:flex;justify-content:center;margin-top:18px}

  /* ===== 游戏页 ===== */
  #screen-game{flex-direction:column;gap:10px;align-items:stretch}
  .game-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
  .game-title{font-size:18px;font-weight:900;letter-spacing:.22em;color:var(--gold);text-shadow:2px 2px 0 #000}
  .game-meta{font-size:11px;color:var(--dim);letter-spacing:.1em;text-align:right}
  .game-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:10px}
  .log-panel{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px #000;display:flex;flex-direction:column;min-height:0}
  .log-top{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:3px solid var(--line);background:var(--panel2);font-size:11px;letter-spacing:.18em;color:var(--dim)}
  .log-top #live-age{color:var(--gold)}
  .log{flex:1;overflow-y:auto;padding:12px 14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;background-image:linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px);background-size:100% 22px}
  .log::-webkit-scrollbar{width:8px}
  .log::-webkit-scrollbar-thumb{background:var(--line)}
  .line{display:flex;gap:9px;padding:5px 8px;margin-bottom:3px;font-size:14px;line-height:1.6;border-left:3px solid transparent;animation:lineIn .18s steps(3)}
  .line .age-tag{flex:0 0 44px;color:var(--dim);font-size:12px;padding-top:2px;letter-spacing:.02em}
  .line .line-text{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word}
  .line.good{border-color:var(--green);color:#c9edb4}
  .line.bad{border-color:var(--red);color:#f2b5a8}
  .line.mid{border-color:var(--line);color:var(--text)}
  .line.mile{border-color:var(--gold);color:var(--gold);background:rgba(255,200,87,.06);font-weight:700}
  .line.sys{border-color:transparent;color:var(--dim);font-size:12px}
  .line.death{border-color:var(--red);background:rgba(255,93,93,.12);color:var(--red);font-weight:900}
  .side-panel{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px #000;padding:12px;overflow-y:auto;display:flex;flex-direction:column;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .avatar-wrap{display:flex;align-items:flex-end;justify-content:center;gap:10px;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:8px}
  #avatar{width:96px;height:96px;border:2px solid var(--line);background:#100d1a;animation:bob 1.1s steps(2) infinite}
  .age-box{text-align:center;padding-bottom:4px}
  .big-age{font-size:52px;font-weight:900;line-height:1;color:var(--gold);text-shadow:3px 3px 0 #000, 0 0 16px rgba(255,200,87,.25)}
  .age-label{font-size:11px;color:var(--dim);letter-spacing:.3em;margin-top:2px}
  .attr{display:grid;grid-template-columns:36px 1fr 24px;align-items:center;gap:7px;margin-bottom:6px;font-size:11px;color:var(--dim)}
  .attr .pixel-bar{height:8px}
  .attr b{text-align:right;color:var(--text);font-size:12px}
  .info-list{margin-top:10px;border-top:2px dashed var(--line);padding-top:8px;font-size:11px;color:var(--dim);line-height:1.9}
  .info-list span{color:var(--text)}
  .talent-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .chip{font-size:10px;border:1px solid var(--line);padding:2px 6px;color:var(--dim);background:rgba(0,0,0,.25)}
  .controls{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:8px}
  .controls .pixel-btn.primary{width:100%}
  .control-row{display:grid;grid-template-columns:1fr 74px;gap:8px}
  .control-row .pixel-btn{width:100%}

  /* ===== 结局页 ===== */
  #screen-end{align-items:flex-start;overflow-y:auto;display:flex;justify-content:center;padding:6px 0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .end-wrap{width:100%;max-width:880px;background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px #000, 10px 10px 0 rgba(0,0,0,.55);padding:24px;margin:auto;animation:appear .5s steps(5)}
  .end-head{display:flex;gap:22px;align-items:center;padding-bottom:16px;border-bottom:2px dashed var(--line)}
  .stamp{
    flex:0 0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:1px;padding:8px;
    border:5px double var(--red);color:var(--red);font-size:28px;font-weight:900;line-height:1.05;
    transform:rotate(-5deg);text-shadow:1px 1px 0 #000;box-shadow:0 0 0 3px #000, inset 0 0 0 2px rgba(255,107,107,.25);
    background:rgba(255,107,107,.06);letter-spacing:0;
  }
  .stamp span{width:1.05em;text-align:center}
  .end-head h1{font-size:clamp(24px,4vw,38px);color:var(--gold);letter-spacing:.12em;line-height:1.2;text-shadow:3px 3px 0 #000}
  .end-cause{color:var(--text);margin-top:8px;font-size:14px;line-height:1.6}
  .end-badge{display:inline-block;margin-top:10px;color:var(--pink);font-size:12px;border:2px solid var(--line);padding:4px 9px;letter-spacing:.1em}
  .end-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .end-stat{background:var(--panel2);border:2px solid var(--line);padding:8px 10px}
  .end-stat .k{font-size:10px;color:var(--dim);letter-spacing:.1em}
  .end-stat .v{font-size:15px;color:var(--text);margin-top:3px;font-weight:700}
  .end-stat .v.gold{color:var(--gold)}
  .ach-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .ach{display:flex;gap:9px;background:var(--panel2);border:2px solid var(--line);padding:9px 11px}
  .ach .star{color:var(--gold);font-size:15px}
  .ach .n{font-size:13px;color:var(--gold);font-weight:700}
  .ach .d{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.4}
  .milestones{display:flex;flex-direction:column;gap:5px;font-size:12px;line-height:1.6}
  .ms{display:flex;gap:10px;padding:4px 8px;border-left:2px solid var(--line);color:var(--text)}
  .ms .age{color:var(--gold);flex:0 0 52px;font-size:11px;padding-top:1px}
  .end-actions{display:flex;justify-content:center;gap:12px;margin-top:22px}
  .empty{color:var(--dim);font-size:12px;padding:6px 4px}

  /* ===== 弹窗 ===== */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(5,3,10,.84);display:flex;align-items:center;justify-content:center;padding:18px}
  .modal-box{width:min(560px,94vw);max-height:88vh;overflow-y:auto;background:var(--panel);border:3px solid var(--gold);box-shadow:0 0 0 3px #000, 12px 12px 0 rgba(0,0,0,.6);padding:22px;animation:pop .25s steps(4)}
  .modal-tag{font-size:10px;letter-spacing:.3em;color:var(--red);margin-bottom:8px}
  .modal-box h2{font-size:22px;color:var(--gold);letter-spacing:.16em;margin-bottom:9px;text-shadow:2px 2px 0 #000}
  .modal-box p{font-size:13px;line-height:1.7;color:var(--text);margin-bottom:16px}
  .modal-options{display:flex;flex-direction:column;gap:8px}
  .choice-btn{display:flex;flex-direction:column;gap:3px;text-align:left;font-family:inherit;background:var(--panel2);border:2px solid var(--line);color:var(--text);padding:11px 13px;cursor:pointer}
  .choice-btn:hover{border-color:var(--gold);background:#241b3b}
  .choice-label{font-size:14px;font-weight:700;color:var(--gold);letter-spacing:.05em}
  .choice-desc{font-size:11px;color:var(--dim);line-height:1.5}

  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes lineIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}

  @media (max-width:760px){
    #app{padding:8px}
    .game-body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;min-width:0}
    .log-panel,.side-panel{min-width:0}
    .side-panel{max-height:45vh;padding:9px}
    .avatar-wrap{display:none}
    #attr-bars{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
    .attr{grid-template-columns:32px 1fr 20px;margin-bottom:4px}
    .info-list{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin-top:6px;padding-top:6px;font-size:10px;line-height:1.65}
    .talent-chips{display:none}
    .controls{margin-top:6px;padding-top:8px;display:grid;grid-template-columns:1fr;gap:6px}
    .control-row{grid-template-columns:1fr 90px}
    .line{font-size:13px;gap:6px;padding:4px 4px}
    .line .age-tag{flex:0 0 36px;font-size:10px}
    .attr-row{grid-template-columns:repeat(2,1fr)}
    .talent-grid{grid-template-columns:1fr}
    .end-stats{grid-template-columns:repeat(2,1fr)}
    .ach-list{grid-template-columns:1fr}
    .end-head{gap:14px}
    .stamp{font-size:22px}
    .panel{padding:16px}
  }
</style>
</head>
<body>
<div id="scanlines"></div>
<div id="app">
  <section id="screen-start" class="screen">
    <div class="start-box">
      <div>
        <div class="logo-cn">人生模拟器<span class="cursor"></span></div>
        <div class="logo-en">PIXEL LIFE SIMULATOR</div>
      </div>
      <canvas id="start-avatar" class="start-avatar" width="96" height="96"></canvas>
      <p class="tagline">投胎是门玄学，活着是门手艺<br><b>这一次，你想活成什么样？</b></p>
      <div class="start-info"><span>▸ 抽取天赋</span><span>▸ 逐年成长</span><span>▸ 人生抉择</span></div>
      <button id="btn-start" class="pixel-btn">开 始 投 胎</button>
      <p class="hint">v1.0 · 纯单机 · 无需联网 · 每次人生都不同</p>
    </div>
  </section>

  <section id="screen-setup" class="screen hidden">
    <div class="panel">
      <h2 class="screen-title">◈ 投 胎 面 板 ◈</h2>
      <div class="attr-row" id="attr-preview"></div>
      <div class="setup-toolbar">
        <button id="btn-reroll" class="pixel-btn small ghost">重 骰 属 性</button>
        <span class="hint" id="talent-count">天赋 0 / 3</span>
      </div>
      <h3 class="section-title">◇ 选择 3 个天赋 ◇</h3>
      <div id="talent-grid" class="talent-grid"></div>
      <div class="begin-wrap">
        <button id="btn-begin" class="pixel-btn" disabled>开 启 人 生</button>
      </div>
    </div>
  </section>

  <section id="screen-game" class="screen hidden">
    <header class="game-header">
      <div class="game-title">人生模拟器</div>
      <div class="game-meta" id="game-meta">第 1 世</div>
    </header>
    <div class="game-body">
      <main class="log-panel">
        <div class="log-top"><span>▸ 人生日志</span><span id="live-age">年龄 --</span></div>
        <div id="log" class="log"></div>
      </main>
      <aside class="side-panel">
        <div class="avatar-wrap">
          <canvas id="avatar" width="96" height="96"></canvas>
          <div class="age-box"><div id="stat-age" class="big-age">0</div><div class="age-label">岁</div></div>
        </div>
        <div id="attr-bars"></div>
        <div id="info-list" class="info-list"></div>
        <div id="talent-chips" class="talent-chips"></div>
        <div class="controls">
          <button id="btn-next" class="pixel-btn primary">下 一 岁 ▶</button>
          <div class="control-row">
            <button id="btn-auto" class="pixel-btn small ghost">自动播放</button>
            <select id="speed" class="pixel-select">
              <option value="900">慢速</option>
              <option value="350" selected>中速</option>
              <option value="90">极速</option>
            </select>
          </div>
          <button id="btn-restart" class="pixel-btn small ghost">重开人生</button>
        </div>
      </aside>
    </div>
  </section>

  <section id="screen-end" class="screen hidden">
    <div class="end-wrap">
      <div class="end-head">
        <div class="stamp" id="end-stamp"></div>
        <div>
          <h1 id="end-title">你的一生</h1>
          <p class="end-cause" id="end-cause"></p>
          <span class="end-badge" id="end-badge"></span>
        </div>
      </div>
      <div class="end-stats" id="end-stats"></div>
      <h3 class="section-title">★ 人生成就 ★</h3>
      <div id="ach-list" class="ach-list"></div>
      <h3 class="section-title">◆ 人生大事 ◆</h3>
      <div id="milestones" class="milestones"></div>
      <div class="end-actions">
        <button id="btn-again" class="pixel-btn">重 开 一 生</button>
      </div>
    </div>
  </section>
</div>
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-tag">◈ 人 生 抉 择 ◈</div>
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <div id="modal-options" class="modal-options"></div>
  </div>
</div>
<script>
(function(){
'use strict';

const $ = function(s){ return document.querySelector(s); };
const rand = function(n){ return Math.floor(Math.random()*n); };
const pick = function(a){ return a[rand(a.length)]; };
const clamp = function(v,min,max){ min=min===undefined?0:min; max=max===undefined?20:max; return Math.max(min,Math.min(max,v)); };

const ATTRS = [
  {k:'looks', n:'颜值', c:'var(--pink)'},
  {k:'intel', n:'智力', c:'var(--blue)'},
  {k:'body',  n:'体质', c:'var(--green)'},
  {k:'wealth',n:'家境', c:'var(--gold)'},
  {k:'joy',   n:'快乐', c:'var(--red)'}
];

const TALENTS = [
  {id:'beauty', n:'天生丽质', d:'颜值 +2，靠脸吃饭不是梦', on:{looks:2}},
  {id:'brain', n:'学霸基因', d:'智力 +2，考试升学更稳', on:{intel:2}},

let S = null;
let setup = { attrs:null, talents:[], rolled:[] };
let autoOn = false;
let autoTimer = null;
let autoResume = false;
let round = 0;

function has(id){
  return !!(S && S.talents.some(function(t){ return t.id===id; }));
}
function statusText(){
  if(!S) return '—';
  if(S.retired) return '退休';
  if(S.job) return S.job;
  if(S.age < 6) return '幼儿';
  if(S.age <= 22 || S.path === 'study') return '学生';
  return '无业';
}
function fmtMoney(n){
  n = Math.max(0, Math.round(n));
  if(n >= 100000000) return (n/100000000).toFixed(1) + '亿';
  if(n >= 10000) return (n/10000).toFixed(n % 10000 === 0 ? 0 : 1) + '万';
  return String(n);
}
function showScreen(name){
  ['start','setup','game','end'].forEach(function(n){
    $('#screen-'+n).classList.toggle('hidden', n !== name);
  });
  if(name !== 'game') stopAuto();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=rand(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* ============ 开局：属性与天赋 ============ */
function rollAttrs(){
  setup.attrs = {};
  ATTRS.forEach(function(a){ setup.attrs[a.k] = 1 + rand(10); });
  renderAttrPreview();
}
function renderAttrPreview(){
  $('#attr-preview').innerHTML = ATTRS.map(function(a){
    const v = setup.attrs[a.k];
    return '<div class="attr-cell">' +
      '<div class="attr-head"><span>'+a.n+'</span><b>'+v+'</b></div>' +
      '<div class="pixel-bar"><i style="width:'+(v*10)+'%;background:'+a.c+'"></i></div>' +
    '</div>';
  }).join('');
}
function openSetup(){
  $('#modal').classList.add('hidden');
  rollAttrs();
  setup.talents = [];
  setup.rolled = shuffle(TALENTS).slice(0,10);
  renderTalents();
  showScreen('setup');
}
function renderTalents(){
  $('#talent-grid').innerHTML = setup.rolled.map(function(t){
    const sel = setup.talents.some(function(x){ return x.id===t.id; });
    return '<button type="button" class="talent-card'+(sel?' selected':'')+'" data-id="'+t.id+'">' +
      '<div class="talent-name">'+t.n+'</div>' +
      '<div class="talent-desc">'+t.d+'</div>' +
    '</button>';
  }).join('');
  $('#talent-count').textContent = '天赋 ' + setup.talents.length + ' / 3';
  $('#btn-begin').disabled = setup.talents.length !== 3;
}
function toggleTalent(id){
  const idx = setup.talents.findIndex(function(t){ return t.id===id; });
  if(idx >= 0){ setup.talents.splice(idx,1); }
  else if(setup.talents.length < 3){
    const t = TALENTS.find(function(x){ return x.id===id; });
    if(t) setup.talents.push(t);
  }
  renderTalents();
}

function beginLife(){
  round++;
  const attrs = Object.assign({}, setup.attrs);
  setup.talents.forEach(function(t){
    if(t.on){ Object.keys(t.on).forEach(function(k){ attrs[k] += t.on[k]; }); }
  });
  ATTRS.forEach(function(a){ attrs[a.k] = clamp(attrs[a.k], 0, 20); });

  S = {
    age:0,
    gender: Math.random() < 0.5 ? '男' : '女',
    attrs: attrs,
    startAttrs: Object.assign({}, attrs),
    talents: setup.talents.slice(),
    money: attrs.wealth * 2000 + (setup.talents.some(function(t){return t.id==='mine';}) ? 30000 : 0),
    salary:0, job:'', edu:'', path:'', college:false,
    married:false, spouse:'', children:0, loves:0,
    luckyHits:0, scares:0, overtime:0, workYears:0, retired:false,
    house:false, car:false, dead:false, cause:'',
    flags:{}, milestones:[], logs:[], done:{}, childSuccess:false, score:0, seen:new Set()
  };

  showScreen('game');
  $('#log').innerHTML = '';
  addLog('你出生了，是个' + S.gender + '孩。' + (S.gender === '男' ? '产房外传来一阵欢呼。' : '护士说你哭声响亮。'), 'mile');
  addLog('【初始属性】颜值 ' + attrs.looks + ' · 智力 ' + attrs.intel + ' · 体质 ' + attrs.body + ' · 家境 ' + attrs.wealth + ' · 快乐 ' + attrs.joy, 'sys');

/* ============ 日志 / 渲染 ============ */
function addLog(text, cls){
  cls = cls || 'mid';
  const el = document.createElement('div');
  el.className = 'line ' + cls;
  el.innerHTML = '<span class="age-tag">' + S.age + '岁</span><span class="line-text">' + text + '</span>';
  const log = $('#log');
  log.appendChild(el);
  while(log.children.length > 600){ log.removeChild(log.firstChild); }
  log.scrollTop = log.scrollHeight;
  if(S.logs.length < 1200){ S.logs.push({age:S.age, text:text, cls:cls}); }
}
function milestone(text){
  S.milestones.push({age:S.age, text:text});
}
function renderGame(){

/* ============ 像素小人 ============ */
function drawSprite(canvas, age, gender, dead){
  const ctx = canvas.getContext('2d');
  const P = function(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x*4,y*4,w*4,h*4); };
  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* 背景 */
  ctx.fillStyle = '#100d1a';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  const stars = [[2,3],[7,1],[18,4],[21,2],[4,9],[20,8],[2,16],[22,15],[6,20],[19,21]];
  ctx.fillStyle = '#2c2444';
  stars.forEach(function(s){ ctx.fillRect(s[0]*4, s[1]*4, 4, 4); });
  ctx.fillStyle = '#2a2141';
  ctx.fillRect(64, 8, 16, 12);
  ctx.fillStyle = '#100d1a';
  ctx.fillRect(68, 4, 16, 12);
  ctx.fillStyle = '#191430';
  ctx.fillRect(0, 84, canvas.width, 12);

  if(dead){
    P(4,20,16,1,'#0a0810');
    P(6,17,12,4,'#5a5368');
    P(7,8,10,9,'#7c7488');
    P(8,7,8,1,'#7c7488');
    P(9,6,6,1,'#7c7488');
    P(8,8,8,1,'#9b93a8');
    ctx.fillStyle = '#2e2838';
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('R.I.P', 48, 62);
    P(4,19,2,1,'#ff9ecb');
    P(18,19,2,1,'#ff9ecb');
    P(4,18,1,1,'#7ee787');
    P(19,18,1,1,'#7ee787');
    ctx.textAlign = 'left';
    return;
  }

  const stage = age <= 3 ? 'baby' : age <= 12 ? 'child' : age <= 18 ? 'teen' : age < 60 ? 'adult' : 'elder';
  const conf = {
    baby:  {hx:8, hy:7, hw:8, hh:8, bx:9,  by:15, bw:6,  bh:4, ly:19},
    child: {hx:8, hy:5, hw:8, hh:7, bx:8,  by:12, bw:8,  bh:6, ly:18},
    teen:  {hx:9, hy:4, hw:7, hh:7, bx:8,  by:11, bw:8,  bh:6, ly:17},
    adult: {hx:9, hy:4, hw:7, hh:7, bx:7,  by:11, bw:10, bh:7, ly:18},
    elder: {hx:9, hy:6, hw:7, hh:7, bx:7,  by:13, bw:10, bh:6, ly:19}
  }[stage];
  const c = conf;
  const skin = '#f0c090';
  const skinDark = '#c99368';
  const hair = stage === 'elder' ? '#a9a3b8' : (gender === '男' ? '#241c2e' : '#3a2438');
  let cloth = '#7a6bd6';
  if(stage === 'baby') cloth = '#f2e2c4';
  else if(stage === 'child') cloth = '#5b8dd6';
  else if(stage === 'teen') cloth = '#8f6fd1';
  else if(stage === 'adult'){
    if(S && S.job === '程序员') cloth = '#4f8fe8';
    else if(S && S.job === '老板') cloth = '#d9a94e';
    else if(S && S.job === '公务员') cloth = '#6f9e75';
    else if(S && (S.job === '打工人' || S.job === '厂哥')) cloth = '#c96f4a';
  } else cloth = '#8a7d6a';

  /* 影子 */
  P(6,21,12,1,'#0c0a12');
  /* 腿 */
  P(c.bx+1, c.ly, 3, 21-c.ly, '#2f2a45');
  P(c.bx+c.bw-4, c.ly, 3, 21-c.ly, '#2f2a45');
  P(c.bx+1, 20, 3, 1, '#17131f');
  P(c.bx+c.bw-4, 20, 3, 1, '#17131f');
  /* 身体 */
  P(c.bx, c.by, c.bw, c.bh, '#1b1626');
  P(c.bx+1, c.by+1, c.bw-2, c.bh-2, cloth);
  P(c.bx+1, c.by+1, c.bw-2, 1, 'rgba(255,255,255,.20)');
  /* 手臂 */
  P(c.bx-2, c.by+1, 2, c.bh-2, '#1b1626');
  P(c.bx-1, c.by+2, 1, c.bh-3, skin);
  P(c.bx+c.bw, c.by+1, 2, c.bh-2, '#1b1626');
  P(c.bx+c.bw, c.by+2, 1, c.bh-3, skin);
  /* 头 */
  P(c.hx-1, c.hy-1, c.hw+2, c.hh+2, '#1b1626');
  P(c.hx, c.hy, c.hw, c.hh, skin);
  P(c.hx, c.hy+c.hh-1, c.hw, 1, skinDark);
  /* 头发 */
  P(c.hx-1, c.hy-1, c.hw+2, 2, hair);
  P(c.hx-1, c.hy+1, 1, 3, hair);
  P(c.hx+c.hw, c.hy+1, 1, 3, hair);
  if(gender === '女'){
    P(c.hx-1, c.hy+2, 1, c.hh-2, hair);
    P(c.hx+c.hw, c.hy+2, 1, c.hh-2, hair);
  }
  /* 五官 */
  P(c.hx+2, c.hy+3, 1, 1, '#241c2e');
  P(c.hx+c.hw-3, c.hy+3, 1, 1, '#241c2e');
  P(c.hx+3, c.hy+c.hh-2, 2, 1, '#a8544f');
  /* 腮红 */
  P(c.hx+1, c.hy+c.hh-3, 1, 1, '#e8a07a');
  P(c.hx+c.hw-2, c.hy+c.hh-3, 1, 1, '#e8a07a');
  /* 老年：眼镜 + 拐杖 */
  if(stage === 'elder'){
    P(c.hx+1, c.hy+2, c.hw-2, 1, '#d8d2c0');
    P(c.hx+1, c.hy+3, 2, 1, '#d8d2c0');
    P(c.hx+c.hw-3, c.hy+3, 2, 1, '#d8d2c0');
    P(c.bx+c.bw+3, c.by, 1, 21-c.by, '#b98b4e');
    P(c.bx+c.bw+2, c.by, 2, 1, '#b98b4e');
  }
  /* 儿童：小书包 */
  if(stage === 'child'){
    P(c.bx+c.bw-1, c.by+1, 2, c.bh-2, '#3f7a55');
  }
  /* 成年男：领带 */
  if(stage === 'adult' && gender === '男' && (S && S.job)){
    P(c.bx+Math.floor(c.bw/2)-1, c.by+1, 1, 4, '#2b2333');
  }
  /* 成年女：裙摆 */
  if(stage === 'adult' && gender === '女'){
    P(c.bx-1, c.by+c.bh-2, c.bw+2, 2, cloth);
  }
}

/* ============ 数值变化 ============ */
function applyEffects(e){
  Object.keys(e).forEach(function(k){
    const v = e[k];
    if(Object.prototype.hasOwnProperty.call(S.attrs, k)){
      let dv = v;
      if(k === 'joy' && dv < 0 && has('sunny')) dv = Math.ceil(dv/2);
      S.attrs[k] = clamp(S.attrs[k] + dv, 0, 20);
      return;
    }
    if(k === 'money') S.money = Math.max(0, S.money + v);
    else if(k === 'salary') S.salary = Math.max(0, S.salary + v);
    else if(k === 'children') S.children += v;
    else if(k === 'loves') S.loves += v;
    else if(k === 'lucky') S.luckyHits += v;
    else if(k === 'overtime') S.overtime += v;
    else if(k === 'house') S.house = true;
    else if(k === 'car') S.car = true;
  });
}
function execEvent(ev){
  const text = typeof ev.t === 'function' ? ev.t() : ev.t;
  if(ev.c === 'bad' && has('unlucky') && Math.random() < 0.1){
    addLog('命运跟你开了个玩笑：' + text + ' 结果居然因祸得福。', 'good');
    S.attrs.joy = clamp(S.attrs.joy + 1);
    S.luckyHits++;
    return;
  }
  addLog(text, ev.c || 'mid');
  const effects = Object.assign({}, ev.e || {});
  if(has('grind') && (ev.tag === 'pressure' || ev.tag === 'study') && effects.intel > 0){
    effects.intel *= 2;
  }
  if(ev.e) applyEffects(effects);
  if(ev.fn) ev.fn();
}
function runPoolEvent(){
  let pool = getPool(S.age).filter(function(ev){
    return !ev.cond || ev.cond();
  });
  const unseen = pool.filter(function(ev){ return !S.seen.has(ev); });
  if(unseen.length >= 3){ pool = unseen; }
  if(!pool.length){
    addLog('这一年没什么特别的事，日子平平淡淡地过去了。', 'mid');
    return;
  }
  const weighted = pool.map(function(ev){
    let w = ev.w || 1;
    if(ev.c === 'good'){
      if(has('koi')) w *= 1.35;
      if(has('blessed')) w *= 1.12;
      if(S.attrs.joy >= 12) w *= 1.1;
    }
    if(ev.c === 'bad'){
      if(has('unlucky')) w *= 1.3;
      if(has('sunny')) w *= 0.92;
      if(has('flat') && ev.tag === 'pressure') w *= 0.5;
    }
    if(ev.tag === 'love' && has('lovebrain')) w *= 2;
    if(ev.tag === 'social' && has('social')) w *= 1.4;
    if(ev.tag === 'creative' && has('poet')) w *= 1.6;
    if(ev.tag === 'accident' && has('safe')) w *= 0.5;
    if(ev.tag === 'food' && has('foodie')) w *= 2;
    return {ev:ev, w:w};
  });
  let total = weighted.reduce(function(a,b){ return a + b.w; }, 0);
  let r = Math.random() * total;
  let chosen = weighted[0].ev;
  for(let i=0;i<weighted.length;i++){
    r -= weighted[i].w;
    if(r <= 0){ chosen = weighted[i].ev; break; }
  }
  S.seen.add(chosen);
  execEvent(chosen);
}
function getPool(age){
  if(age <= 3) return BABY;
  if(age <= 6) return CHILD;
  if(age <= 12) return PUPIL;
  if(age <= 15) return JUNIOR;
  if(age <= 18) return SENIOR;
  if(age <= 22) return YOUTH;
  if(age <= 30) return YOUNG_ADULT;
  if(age <= 50) return MIDDLE;
  if(age <= 70) return OLDER;
  return ELDER;
}

/* ============ 关键抉择 ============ */
function startJob(){
  S.path = 'work';
  if(S.attrs.intel >= 8){ S.job = '程序员'; S.salary = 15000; }
  else if(S.attrs.intel >= 5){ S.job = '白领'; S.salary = 9000; }
  else { S.job = '打工人'; S.salary = 5500; }
  addLog('你入职了，成了一名' + S.job + '，月薪 ' + S.salary + ' 元。', 'good');
  milestone('第一份工作');
}
function startBiz(){
  S.path = 'boss';
  S.money = Math.max(0, S.money - 20000);
  if(Math.random() < 0.45){
    S.job = '老板'; S.salary = 12000 + rand(8000);
    S.attrs.joy = clamp(S.attrs.joy + 2);
    addLog('你开了家小店，生意还不错，当上了小老板。', 'good');
    milestone('开店当老板');
  } else {
    S.job = '打工人'; S.salary = 5000;
    S.attrs.joy = clamp(S.attrs.joy - 2);
    addLog('创业失败，积蓄见了底。你重新找了份工作，把梦想收进抽屉。', 'bad');
    milestone('创业失败');
  }
}

/* ============ 固定人生节点 ============ */
const FIXED = {
  6: function(){
    S.edu = '小学';
    addLog('你背上小书包，成了一名小学生。', 'mile');
    milestone('上小学');
  },
  12: function(){
    S.edu = '初中';
    addLog('你升入初中，课业突然变多了。', 'mile');
    milestone('上初中');
  },
  25: function(){
    if(S.path === 'study' && !S.job){
      S.job = S.attrs.intel >= 9 ? '研究员' : '白领';
      S.salary = S.attrs.intel >= 9 ? 12000 : 9000;
      addLog('硕士毕业，你进入了一家不错的单位工作。', 'good');
      milestone('硕士毕业');
    }
  },
  60: function(){
    S.retired = true;
    S.salary = 0;
    S.job = '退休';
    S.attrs.joy = clamp(S.attrs.joy + 2);
    addLog('你正式退休了。辛苦了半辈子，终于可以睡到自然醒。', 'mile');
    milestone('退休');
  },
  70: function(){
    S.attrs.body = clamp(S.attrs.body - 1);
    S.attrs.joy = clamp(S.attrs.joy + 1);
    addLog('七十岁了。你开始觉得楼梯比从前陡了。', 'mid');
  },
  80: function(){
    S.attrs.body = clamp(S.attrs.body - 1);
    addLog('八十岁了。你开始喜欢坐在窗边，看太阳一点点落下去。', 'mid');
  },
  90: function(){
    S.attrs.body = clamp(S.attrs.body - 1);
    addLog('九十岁了。你成了小区里最年长的人，大家都来向你讨教长寿秘诀。', 'mile');
    milestone('九十高寿');
  }
};

/* ============ 年份推进 ============ */
function nextYear(){
  if(!S || S.dead) return;
  if(!$('#modal').classList.contains('hidden')) return;
  S.age++;

  if(S.salary > 0 && !S.retired){ S.money += S.salary * 12; S.workYears++; }
  if(S.retired){ S.money += 30000; }

  const fixed = FIXED[S.age];
  if(fixed) fixed();

  if(S.age === 30 && has('uncle') && !S.flags.uncleDone){
    S.flags.uncleDone = true;
    if(Math.random() < 0.5){
      S.money += 100000;
      S.luckyHits++;
      addLog('一位多年未见的神秘亲戚去世了，留给你十万元遗产。你决定先去吃顿好的。', 'good');
      milestone('继承神秘遗产');
    } else {
      addLog('你想起自己还有一位神秘亲戚，托人打听后得知对方早已移民，电话成了空号。', 'mid');
    }
  }

  const ch = CHOICES[S.age];
  if(ch && !S.done[S.age] && (!ch.cond || ch.cond())){
    S.done[S.age] = true;
    renderGame();
    openChoice(ch);
    return;
  }
  if(!fixed) runPoolEvent();

  renderGame();
  drawSprite($('#avatar'), S.age, S.gender, false);
  checkDeath();
  if(!S.dead){ renderGame(); }
}

function openChoice(ch){
  const resume = autoOn;
  stopAuto();
  $('#modal-title').textContent = ch.title;
  $('#modal-text').textContent = typeof ch.text === 'function' ? ch.text() : ch.text;
  const box = $('#modal-options');
  box.innerHTML = '';
  const opts = typeof ch.options === 'function' ? ch.options() : ch.options;
  opts.forEach(function(opt){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice-btn';
    b.innerHTML = '<span class="choice-label">▸ ' + opt.label + '</span><span class="choice-desc">' + opt.desc + '</span>';
    b.addEventListener('click', function(){
      $('#modal').classList.add('hidden');
      $('#btn-next').disabled = false;
      opt.run();
      renderGame();
      drawSprite($('#avatar'), S.age, S.gender, false);
      if(!S.dead && resume){ startAuto(); }
    });
    box.appendChild(b);
  });
  $('#modal').classList.remove('hidden');
  $('#btn-next').disabled = true;
}

function startAuto(){
  if(!S || S.dead) return;
  autoOn = true;
  $('#btn-auto').textContent = '暂停播放';
  if(autoTimer){ clearInterval(autoTimer); }
  autoTimer = setInterval(function(){
    if($('#modal').classList.contains('hidden') && S && !S.dead){ nextYear(); }
  }, parseInt($('#speed').value, 10));
}
function stopAuto(){
  autoOn = false;
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  const b = $('#btn-auto');
  if(b) b.textContent = '自动播放';
}

/* ============ 死亡与结算 ============ */
function checkDeath(){
  if(!S || S.dead) return;
  if(S.attrs.body <= 0){
    if(Math.random() < 0.5){
      die(pick(['积劳成疾，医治无效', '一场重病带走了你', '身体彻底垮了']));
      return;
    }
    addLog('你大病一场，在鬼门关走了一遭，幸运地捡回一条命。', 'bad');
    S.scares++;
    S.attrs.body = 2;
  }
  if(S.age >= 70){
    let p = 0.035 + Math.max(0, S.age - 70) * 0.013;
    if(S.attrs.body >= 10) p *= 0.65;
    if(S.attrs.body <= 3) p *= 1.6;
    if(S.age >= 100) p = Math.max(p, 0.65);
    if(S.age >= 110){ die('寿终正寝，无疾而终'); return; }
    if(Math.random() < p){
      die(pick(['在睡梦中安详离世', '器官衰竭，医治无效', '寿终正寝，无疾而终']));
    }
  }
}

function die(cause){
  if(S.dead) return;
  S.dead = true;
  S.cause = cause;
  stopAuto();
  addLog('你' + cause + '，人生落幕。', 'death');
  renderGame();
  drawSprite($('#avatar'), S.age, S.gender, true);
  setTimeout(showEnd, 900);
}

function getTitle(a){
  if(S.age >= 95) return '寿比南山';
  if(a.looks >= 12) return S.gender === '男' ? '国民老公' : '国民女神';
  if(a.intel >= 12) return '学神降世';
  if(a.wealth >= 12) return '隐形富豪';
  if(a.body >= 12) return '钢铁之躯';
  if(a.joy >= 12) return '人间开心果';
  if(S.money >= 500000) return '小有积蓄';
  if(S.married && S.children > 0) return '人生圆满';
  return '平平无奇';
}

function getAchievements(){
  const a = S.attrs;
  const list = [];
  const add = function(n, d){ list.push({n:n, d:d}); };
  if(S.college && a.intel >= 9) add('学霸光环', '考上大学，且智力达到 9');
  if(S.edu === '硕士') add('学术大拿', '读完了研究生');
  if(S.job === '老板') add('创业先锋', '自己当上了老板');
  if(a.wealth >= 13) add('富甲一方', '家境达到 13');
  if(S.age >= 90) add('高寿老人', '活到了 90 岁');
  if(S.age >= 100) add('长命百岁', '活到了 100 岁');
  if(S.children >= 2) add('儿孙满堂', '有两个以上的孩子');
  if(S.married) add('有情人终成眷属', '结了婚');
  if(!S.married && S.age >= 60) add('单身贵族', '一辈子没有结婚');
  if(S.loves >= 3) add('情场高手', '谈过 3 段以上恋爱');
  if(a.body >= 12) add('钢铁之躯', '体质达到 12');
  if(a.looks >= 12) add('颜值天花板', '颜值达到 12');
  if(S.startAttrs.wealth <= 2 && a.wealth >= 8) add('逆天改命', '出身寒门，终成大器');
  if(S.luckyHits >= 2) add('锦鲤本鲤', '触发 2 次以上幸运事件');
  if(S.scares >= 1) add('大难不死', '从鬼门关走过一遭');
  if(S.overtime >= 6) add('卷王之王', '加班超过 6 次');
  if(S.money >= 1000000) add('百万富翁', '存款突破 100 万');
  if(S.childSuccess) add('教子有方', '把孩子送进了重点高中');
  return list;
}

function endCell(k, v, gold){
  return '<div class="end-stat"><div class="k">' + k + '</div><div class="v' + (gold ? ' gold' : '') + '">' + v + '</div></div>';
}

function showEnd(){
  if(!S) return;
  const a = S.attrs;
  const ach = getAchievements();
  let score = a.looks + a.intel + a.body + a.wealth + a.joy + S.age * 0.5 + ach.length * 3;
  if(S.married) score += 2;
  if(S.children > 0) score += 3;
  if(S.house) score += 3;
  if(S.money >= 1000000) score += 5;
  score = Math.round(score);
  S.score = score;

  let rank;
  const early = S.age < 20;
  if(early && (a.looks + a.intel) >= 14) rank = '天妒英才';
  else if(early) rank = '英年早逝';
  else if(S.startAttrs.wealth <= 2 && a.wealth >= 10) rank = '逆天改命';
  else if(score >= 100) rank = '传奇人生';
  else if(score >= 80) rank = '人生赢家';
  else if(score >= 60) rank = '小有所成';
  else if(score >= 42) rank = '平凡一生';
  else rank = '人间疾苦';

  $('#end-stamp').innerHTML = rank.split('').map(function(ch){ return '<span>' + ch + '</span>'; }).join('');
  $('#end-title').textContent = (S.age >= 60 ? '享年 ' : '年仅 ') + S.age + ' 岁';
  $('#end-cause').textContent = S.cause + '。这一生起起落落，到此为止。';
  $('#end-badge').textContent = '称号 · ' + getTitle(a) + '   |   人生评分 ' + score;

  $('#end-stats').innerHTML =
    endCell('颜值', a.looks) + endCell('智力', a.intel) + endCell('体质', a.body) + endCell('家境', a.wealth) +
    endCell('快乐', a.joy) + endCell('存款', '¥ ' + fmtMoney(S.money), true) + endCell('职业', statusText()) +
    endCell('学历', S.edu || '—') + endCell('婚姻', S.married ? '已婚' : '未婚') +
    endCell('子女', S.children + ' 个') + endCell('房产', S.house ? '有' : '无') + endCell('评分', score, true);

  $('#ach-list').innerHTML = ach.length
    ? ach.map(function(x){
        return '<div class="ach"><span class="star">★</span><span><div class="n">' + x.n + '</div><div class="d">' + x.d + '</div></span></div>';
      }).join('')
    : '<div class="empty">这一生没什么值得炫耀的成就，但你来过。</div>';

  const ms = S.milestones.slice();
  ms.push({age:S.age, text:'人生落幕：' + S.cause});
  $('#milestones').innerHTML = ms.map(function(m){
    return '<div class="ms"><span class="age">第 ' + m.age + ' 岁</span><span>' + m.text + '</span></div>';
  }).join('');

  $('#screen-end').scrollTop = 0;
  showScreen('end');
}

/* ============ 事件绑定 ============ */
$('#btn-start').addEventListener('click', openSetup);
$('#btn-reroll').addEventListener('click', rollAttrs);
$('#talent-grid').addEventListener('click', function(e){
  const card = e.target.closest('.talent-card');
  if(!card) return;
  toggleTalent(card.getAttribute('data-id'));
});
$('#btn-begin').addEventListener('click', beginLife);
$('#btn-next').addEventListener('click', nextYear);
$('#btn-auto').addEventListener('click', function(){
  if(autoOn) stopAuto(); else startAuto();
});
$('#speed').addEventListener('change', function(){
  if(autoOn) startAuto();
});
$('#btn-restart').addEventListener('click', function(){
  stopAuto();
  openSetup();
});
$('#btn-again').addEventListener('click', function(){
  stopAuto();
  openSetup();
});
document.addEventListener('keydown', function(e){
  if(e.code === 'Space' && !$('#screen-game').classList.contains('hidden')){
    e.preventDefault();
    if($('#modal').classList.contains('hidden')) nextYear();
  }
  if(e.code === 'Enter' && !$('#screen-setup').classList.contains('hidden') && !$('#btn-begin').disabled){
    beginLife();
  }
});

drawSprite($('#start-avatar'), 28, '男', false);

})();
</script>
